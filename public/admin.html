<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QuickCash Admin</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh;
  }
  .hidden { display: none !important; }

  .login-wrap {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .login-card {
    background: #1e293b; border-radius: 16px; padding: 40px;
    width: 100%; max-width: 380px; border: 1px solid #334155;
  }
  .login-card h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: #fff; }
  .login-card p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; }
  .login-card input {
    width: 100%; padding: 14px 16px; border-radius: 10px;
    border: 1px solid #334155; background: #0f172a;
    color: #fff; font-size: 15px; margin-bottom: 14px;
  }
  .login-card input:focus { outline: none; border-color: #6366f1; }
  .login-card button {
    width: 100%; padding: 14px; border-radius: 10px; border: none;
    background: #6366f1; color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  .login-card button:hover { background: #4f46e5; }
  .login-card button:disabled { background: #475569; cursor: not-allowed; }
  .error { color: #f87171; font-size: 13px; margin-top: 10px; }

  header {
    background: #1e293b; padding: 16px 24px;
    border-bottom: 1px solid #334155;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 18px; font-weight: 700; color: #fff; }
  header .actions { display: flex; gap: 10px; align-items: center; }
  header button {
    padding: 8px 16px; border-radius: 8px; border: 1px solid #334155;
    background: transparent; color: #cbd5e1; cursor: pointer;
    font-size: 13px; font-weight: 500;
  }
  header button:hover { background: #334155; }

  main { padding: 24px; max-width: 1500px; margin: 0 auto; }
  .tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .tab {
    padding: 10px 18px; border-radius: 8px; border: 1px solid #334155;
    background: transparent; color: #cbd5e1; cursor: pointer;
    font-size: 14px; font-weight: 500;
  }
  .tab.active { background: #6366f1; color: #fff; border-color: #6366f1; }
  .tab .badge {
    display: inline-block; margin-left: 8px;
    background: #dc2626; color: #fff;
    padding: 1px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 700;
  }

  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px; margin-bottom: 24px;
  }
  .stat-card {
    background: #1e293b; border-radius: 12px; padding: 18px;
    border: 1px solid #334155;
  }
  .stat-card .label {
    font-size: 12px; color: #94a3b8; text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .stat-card .value { font-size: 26px; font-weight: 700; color: #fff; }
  .stat-card.accent-green .value { color: #4ade80; }
  .stat-card.accent-orange .value { color: #fb923c; }
  .stat-card.accent-blue .value { color: #60a5fa; }
  .stat-card.accent-purple .value { color: #a78bfa; }
  .stat-card.accent-red .value { color: #f87171; }

  .chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
  }
  .chart-card {
    background: #1e293b; border-radius: 12px; padding: 20px;
    border: 1px solid #334155;
  }
  .chart-card h3 {
    font-size: 14px; font-weight: 600; color: #cbd5e1;
    margin-bottom: 16px; text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .chart-wrap { position: relative; height: 260px; }

  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px; margin-bottom: 24px;
  }
  .kpi-card {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border-radius: 12px; padding: 24px;
    border: 1px solid #334155;
    text-align: center;
  }
  .kpi-card .kpi-label {
    font-size: 12px; color: #94a3b8; text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 12px;
  }
  .kpi-card .kpi-value {
    font-size: 36px; font-weight: 700; color: #fff;
    margin-bottom: 6px;
  }
  .kpi-card .kpi-sub {
    font-size: 12px; color: #64748b;
  }
  .kpi-card.green .kpi-value { color: #4ade80; }
  .kpi-card.blue .kpi-value { color: #60a5fa; }
  .kpi-card.orange .kpi-value { color: #fb923c; }

  .funnel-row {
    display: flex; align-items: center; margin-bottom: 12px;
    font-size: 13px;
  }
  .funnel-label {
    width: 100px; color: #94a3b8;
  }
  .funnel-bar {
    flex: 1; height: 26px; background: #0f172a;
    border-radius: 6px; overflow: hidden; margin: 0 12px;
    position: relative;
  }
  .funnel-bar-fill {
    height: 100%; background: linear-gradient(90deg, #6366f1, #4f46e5);
    border-radius: 6px; transition: width 0.4s ease;
  }
  .funnel-bar-fill.green {
    background: linear-gradient(90deg, #16a34a, #22c55e);
  }
  .funnel-value {
    width: 60px; text-align: right; color: #fff; font-weight: 600;
  }

  .toolbar {
    display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
    align-items: center;
  }
  .toolbar input, .toolbar select {
    padding: 10px 14px; border-radius: 8px;
    border: 1px solid #334155; background: #1e293b;
    color: #fff; font-size: 14px; min-width: 200px;
  }
  .toolbar input:focus, .toolbar select:focus { outline: none; border-color: #6366f1; }
  .toolbar button {
    padding: 10px 16px; border-radius: 8px; border: 1px solid #334155;
    background: #1e293b; color: #cbd5e1; cursor: pointer; font-size: 14px;
  }
  .toolbar button:hover { background: #334155; }
  .toolbar button.primary { background: #16a34a; color: #fff; border-color: #16a34a; }
  .toolbar button.primary:hover { background: #15803d; }

  .table-wrap {
    background: #1e293b; border-radius: 12px;
    border: 1px solid #334155; overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left; padding: 14px 16px; color: #94a3b8;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
    font-weight: 600; border-bottom: 1px solid #334155; background: #0f172a;
  }
  td { padding: 14px 16px; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
  tr:hover td { background: #172033; }

  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 12px;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
  }
  .badge.PENDING { background: rgba(251,146,60,.15); color: #fb923c; }
  .badge.ACTIVE { background: rgba(74,222,128,.15); color: #4ade80; }
  .badge.PAID { background: rgba(96,165,250,.15); color: #60a5fa; }
  .badge.REJECTED { background: rgba(248,113,113,.15); color: #f87171; }
  .badge.DEFAULTED { background: rgba(248,113,113,.15); color: #f87171; }
  .badge.VERIFIED { background: rgba(74,222,128,.15); color: #4ade80; }

  .btn {
    padding: 6px 12px; border-radius: 6px; border: none;
    font-size: 12px; font-weight: 600; cursor: pointer; margin-right: 6px;
  }
  .btn-approve { background: #16a34a; color: #fff; }
  .btn-approve:hover { background: #15803d; }
  .btn-reject { background: #dc2626; color: #fff; }
  .btn-reject:hover { background: #b91c1c; }
  .btn-view { background: #6366f1; color: #fff; }
  .btn-view:hover { background: #4f46e5; }

  .empty { text-align: center; padding: 40px; color: #64748b; font-size: 14px; }
  .loading { text-align: center; padding: 40px; color: #94a3b8; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 100;
  }
  .modal {
    background: #1e293b; border-radius: 16px;
    border: 1px solid #334155; max-width: 720px; width: 100%;
    max-height: 85vh; overflow-y: auto;
  }
  .modal-header {
    padding: 20px 24px; border-bottom: 1px solid #334155;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: #1e293b; z-index: 1;
  }
  .modal-header h2 { font-size: 18px; font-weight: 700; color: #fff; }
  .modal-header button {
    background: transparent; border: none; color: #94a3b8;
    cursor: pointer; font-size: 24px; line-height: 1;
  }
  .modal-body { padding: 24px; }

  .detail-row {
    display: flex; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid #1e293b; font-size: 14px;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .k { color: #94a3b8; }
  .detail-row .v { color: #fff; font-weight: 600; }

  .section-title {
    font-size: 12px; color: #94a3b8; text-transform: uppercase;
    letter-spacing: 0.5px; margin: 20px 0 12px; font-weight: 600;
  }

  .kyc-imgs {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 10px; margin-top: 8px;
  }
  .kyc-img-box {
    background: #0f172a; border-radius: 10px;
    border: 1px solid #334155; padding: 8px; text-align: center;
  }
  .kyc-img-box .label {
    font-size: 11px; color: #94a3b8; margin-bottom: 6px;
  }
  .kyc-img-box img {
    width: 100%; border-radius: 6px;
    aspect-ratio: 16/10; object-fit: cover; background: #334155;
  }
  .kyc-img-box .placeholder {
    width: 100%; aspect-ratio: 16/10;
    display: flex; align-items: center; justify-content: center;
    background: #334155; border-radius: 6px; color: #64748b; font-size: 12px;
  }
</style>
</head>
<body>

<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <h1>QuickCash Admin</h1>
    <p>Enter your admin password to continue</p>
    <input type="password" id="password-input" placeholder="Admin password" autofocus />
    <button id="login-btn">Sign In</button>
    <div id="login-error" class="error"></div>
  </div>
</div>

<div id="dashboard" class="hidden">
  <header>
    <h1>QuickCash Admin</h1>
    <div class="actions">
      <button id="refresh-btn">↻ Refresh</button>
      <button id="logout-btn">Log Out</button>
    </div>
  </header>

  <main>
    <div class="tabs">
      <button class="tab active" data-tab="overview">Overview</button>
      <button class="tab" data-tab="analytics">Analytics</button>
      <button class="tab" data-tab="loans">Loans</button>
      <button class="tab" data-tab="kyc">KYC <span id="kyc-badge" class="badge hidden"></span></button>
      <button class="tab" data-tab="users">Users</button>
    </div>

    <div id="tab-overview">
      <div class="stats-grid" id="stats-grid">
        <div class="loading">Loading stats...</div>
      </div>
    </div>

    <div id="tab-analytics" class="hidden">
      <div class="kpi-grid" id="kpi-grid">
        <div class="loading">Loading KPIs...</div>
      </div>

      <div class="chart-grid">
        <div class="chart-card">
          <h3>Daily Loans (Last 30 Days)</h3>
          <div class="chart-wrap"><canvas id="chart-loans"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>Daily Disbursed Amount</h3>
          <div class="chart-wrap"><canvas id="chart-disbursed"></canvas></div>
        </div>
      </div>

      <div class="chart-grid">
        <div class="chart-card">
          <h3>Loan Status Breakdown</h3>
          <div class="chart-wrap"><canvas id="chart-status"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>KYC Funnel</h3>
          <div style="padding: 20px 0;" id="kyc-funnel"></div>
        </div>
      </div>
    </div>

    <div id="tab-loans" class="hidden">
      <div class="toolbar">
        <select id="loans-status">
          <option value="PENDING">Pending</option>
          <option value="ACTIVE">Active</option>
          <option value="PAID">Paid</option>
          <option value="REJECTED">Rejected</option>
          <option value="ALL">All</option>
        </select>
        <select id="loans-range">
          <option value="all">All time</option>
          <option value="today">Today</option>
          <option value="week">This week</option>
          <option value="month">Last 30 days</option>
        </select>
        <button id="export-csv-btn" class="primary">⬇ Export CSV</button>
      </div>
      <div class="table-wrap" id="loans-table">
        <div class="loading">Loading loans...</div>
      </div>
    </div>

    <div id="tab-kyc" class="hidden">
      <div class="toolbar">
        <select id="kyc-status">
          <option value="PENDING">Pending</option>
          <option value="VERIFIED">Verified</option>
          <option value="REJECTED">Rejected</option>
          <option value="ALL">All</option>
        </select>
      </div>
      <div class="table-wrap" id="kyc-table">
        <div class="loading">Loading KYC submissions...</div>
      </div>
    </div>

    <div id="tab-users" class="hidden">
      <div class="toolbar">
        <input type="text" id="user-search" placeholder="Search by name, phone, or email..." />
        <button id="user-search-btn">Search</button>
      </div>
      <div class="table-wrap" id="users-table">
        <div class="loading">Loading users...</div>
      </div>
    </div>
  </main>
</div>

<div id="modal-container" class="hidden"></div>

<script>
const API = '/api/admin';
let token = localStorage.getItem('admin_token');
let kycPendingCount = 0;
let chartLoans = null;
let chartDisbursed = null;
let chartStatus = null;

function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
}

async function api(path, options = {}) {
  const res = await fetch(API + path, {
    ...options,
    headers: { ...authHeaders(), ...(options.headers || {}) },
  });
  if (res.status === 401 || res.status === 403) {
    logout();
    throw new Error('Session expired');
  }
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || 'Request failed');
  }
  return res.json();
}

function money(n) { return '$' + Number(n || 0).toFixed(2); }
function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function fmtDate(s) {
  if (!s) return '—';
  return new Date(s).toLocaleString('en-GB', {
    day: '2-digit', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit',
  });
}

const loginScreen = document.getElementById('login-screen');
const dashboard = document.getElementById('dashboard');
const loginError = document.getElementById('login-error');

async function login() {
  const pwd = document.getElementById('password-input').value;
  if (!pwd) return;
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  loginError.textContent = '';

  try {
    const res = await fetch(API + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');

    token = data.token;
    localStorage.setItem('admin_token', token);
    showDashboard();
  } catch (e) {
    loginError.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}

function logout() {
  token = null;
  localStorage.removeItem('admin_token');
  dashboard.classList.add('hidden');
  loginScreen.classList.remove('hidden');
  document.getElementById('password-input').value = '';
}

function showDashboard() {
  loginScreen.classList.add('hidden');
  dashboard.classList.remove('hidden');
  loadStats();
  loadLoans();
  loadKyc();
  loadUsers();
}

document.getElementById('login-btn').onclick = login;
document.getElementById('password-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});
document.getElementById('logout-btn').onclick = logout;

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const name = tab.dataset.tab;
    ['overview', 'analytics', 'loans', 'kyc', 'users'].forEach(n => {
      document.getElementById('tab-' + n).classList.toggle('hidden', n !== name);
    });
    if (name === 'analytics') loadAnalytics();
  };
});

async function loadStats() {
  const grid = document.getElementById('stats-grid');
  try {
    const s = await api('/stats');
    kycPendingCount = s.kycPending || 0;
    updateKycBadge();

    grid.innerHTML = `
      <div class="stat-card accent-blue"><div class="label">Total Users</div><div class="value">${s.totalUsers}</div></div>
      <div class="stat-card accent-green"><div class="label">KYC Verified</div><div class="value">${s.kycVerified}</div></div>
      <div class="stat-card accent-orange"><div class="label">KYC Pending</div><div class="value">${s.kycPending}</div></div>
      <div class="stat-card accent-orange"><div class="label">Pending Loans</div><div class="value">${s.pendingLoans}</div></div>
      <div class="stat-card accent-green"><div class="label">Active Loans</div><div class="value">${s.activeLoans}</div></div>
      <div class="stat-card accent-blue"><div class="label">Paid Loans</div><div class="value">${s.paidLoans}</div></div>
      <div class="stat-card accent-purple"><div class="label">Total Disbursed</div><div class="value">${money(s.totalDisbursed)}</div></div>
      <div class="stat-card accent-green"><div class="label">Total Collected</div><div class="value">${money(s.totalCollected)}</div></div>
      <div class="stat-card accent-red"><div class="label">Outstanding</div><div class="value">${money(s.totalExpected - s.totalCollected)}</div></div>
    `;
  } catch (e) {
    grid.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

function updateKycBadge() {
  const b = document.getElementById('kyc-badge');
  if (kycPendingCount > 0) {
    b.textContent = kycPendingCount;
    b.classList.remove('hidden');
  } else {
    b.classList.add('hidden');
  }
}

async function loadAnalytics() {
  try {
    const data = await api('/analytics');

    const kpiGrid = document.getElementById('kpi-grid');
    kpiGrid.innerHTML = `
      <div class="kpi-card green">
        <div class="kpi-label">Collection Rate</div>
        <div class="kpi-value">${data.collection.rate}%</div>
        <div class="kpi-sub">${money(data.collection.totalCollected)} of ${money(data.collection.totalExpected)}</div>
      </div>
      <div class="kpi-card blue">
        <div class="kpi-label">Total Collected</div>
        <div class="kpi-value">${money(data.collection.totalCollected)}</div>
        <div class="kpi-sub">All time repayments</div>
      </div>
      <div class="kpi-card orange">
        <div class="kpi-label">Outstanding</div>
        <div class="kpi-value">${money(data.collection.totalExpected - data.collection.totalCollected)}</div>
        <div class="kpi-sub">Still to collect</div>
      </div>
    `;

    const f = data.kycFunnel;
    const pct1 = f.totalUsers > 0 ? 100 : 0;
    const pct2 = f.totalUsers > 0 ? (f.submitted / f.totalUsers) * 100 : 0;
    const pct3 = f.totalUsers > 0 ? (f.verified / f.totalUsers) * 100 : 0;
    document.getElementById('kyc-funnel').innerHTML = `
      <div class="funnel-row">
        <div class="funnel-label">Total Users</div>
        <div class="funnel-bar"><div class="funnel-bar-fill" style="width:${pct1}%"></div></div>
        <div class="funnel-value">${f.totalUsers}</div>
      </div>
      <div class="funnel-row">
        <div class="funnel-label">Submitted</div>
        <div class="funnel-bar"><div class="funnel-bar-fill" style="width:${pct2}%"></div></div>
        <div class="funnel-value">${f.submitted}</div>
      </div>
      <div class="funnel-row">
        <div class="funnel-label">Verified</div>
        <div class="funnel-bar"><div class="funnel-bar-fill green" style="width:${pct3}%"></div></div>
        <div class="funnel-value">${f.verified}</div>
      </div>
    `;

    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = '#334155';
    Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";

    if (chartLoans) chartLoans.destroy();
    chartLoans = new Chart(document.getElementById('chart-loans'), {
      type: 'line',
      data: {
        labels: data.daily.labels,
        datasets: [{
          label: 'Loans',
          data: data.daily.loans,
          borderColor: '#6366f1',
          backgroundColor: 'rgba(99,102,241,0.15)',
          tension: 0.35,
          fill: true,
          pointRadius: 3,
          pointBackgroundColor: '#6366f1',
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { precision: 0 } },
          x: { ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } },
        },
      },
    });

    if (chartDisbursed) chartDisbursed.destroy();
    chartDisbursed = new Chart(document.getElementById('chart-disbursed'), {
      type: 'bar',
      data: {
        labels: data.daily.labels,
        datasets: [{
          label: 'Disbursed',
          data: data.daily.disbursed,
          backgroundColor: '#22c55e',
          borderRadius: 4,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { callback: (v) => '$' + v } },
          x: { ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } },
        },
      },
    });

    const s = data.statusBreakdown;
    if (chartStatus) chartStatus.destroy();
    chartStatus = new Chart(document.getElementById('chart-status'), {
      type: 'doughnut',
      data: {
        labels: ['Pending', 'Active', 'Paid', 'Rejected', 'Defaulted'],
        datasets: [{
          data: [s.PENDING, s.ACTIVE, s.PAID, s.REJECTED, s.DEFAULTED],
          backgroundColor: ['#fb923c', '#4ade80', '#60a5fa', '#f87171', '#dc2626'],
          borderWidth: 0,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right', labels: { boxWidth: 12, padding: 12 } },
        },
        cutout: '60%',
      },
    });
  } catch (e) {
    console.error(e);
    alert('Analytics load failed: ' + e.message);
  }
}

async function loadLoans() {
  const wrap = document.getElementById('loans-table');
  wrap.innerHTML = '<div class="loading">Loading loans...</div>';
  const status = document.getElementById('loans-status').value;
  const range = document.getElementById('loans-range').value;
  try {
    const data = await api('/loans?status=' + status + '&range=' + range);
    if (!data.loans.length) {
      wrap.innerHTML = '<div class="empty">No loans in this category</div>';
      return;
    }
    wrap.innerHTML = `
      <table>
        <thead><tr>
          <th>User</th><th>Amount</th><th>Total Due</th><th>Outstanding</th>
          <th>Duration</th><th>Status</th><th>Applied</th><th>Actions</th>
        </tr></thead>
        <tbody>
          ${data.loans.map(l => `
            <tr>
              <td>${esc(l.user?.name || l.user?.phone || 'Unknown')}<br><span style="font-size:11px;color:#64748b">${esc(l.user?.phone || '')}</span></td>
              <td>${money(l.amount)}</td>
              <td>${money(l.totalDue)}</td>
              <td>${money(l.outstanding)}</td>
              <td>${l.durationDays} days</td>
              <td><span class="badge ${l.status}">${l.status}</span></td>
              <td>${fmtDate(l.appliedAt)}</td>
              <td>
                ${l.status === 'PENDING' ? `
                  <button class="btn btn-approve" onclick="approveLoan('${l.id}')">Approve</button>
                  <button class="btn btn-reject" onclick="rejectLoan('${l.id}')">Reject</button>
                ` : '—'}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (e) {
    wrap.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

document.getElementById('loans-status').onchange = loadLoans;
document.getElementById('loans-range').onchange = loadLoans;
document.getElementById('export-csv-btn').onclick = () => {
  const status = document.getElementById('loans-status').value;
  const url = 'https://quickcash-backend-production-5837.up.railway.app/api/admin/export/loans.csv?status=' + status;
  fetch(url, { headers: { 'Authorization': 'Bearer ' + token } })
    .then(r => r.blob())
    .then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'loans-' + Date.now() + '.csv';
      a.click();
    });
};

async function approveLoan(id) {
  if (!confirm('Approve this loan?')) return;
  try {
    await api('/loans/' + id + '/approve', { method: 'POST' });
    alert('Loan approved ✅');
    loadLoans();
    loadStats();
  } catch (e) { alert('Error: ' + e.message); }
}

async function rejectLoan(id) {
  const reason = prompt('Reason for rejection (optional):');
  if (reason === null) return;
  try {
    await api('/loans/' + id + '/reject', {
      method: 'POST',
      body: JSON.stringify({ reason }),
    });
    alert('Loan rejected');
    loadLoans();
    loadStats();
  } catch (e) { alert('Error: ' + e.message); }
}

async function loadKyc() {
  const wrap = document.getElementById('kyc-table');
  wrap.innerHTML = '<div class="loading">Loading KYC...</div>';
  const status = document.getElementById('kyc-status').value;
  try {
    const data = await api('/kyc?status=' + status);
    if (!data.submissions.length) {
      wrap.innerHTML = '<div class="empty">No KYC submissions</div>';
      return;
    }
    wrap.innerHTML = `
      <table>
        <thead><tr>
          <th>User</th><th>Document</th><th>Status</th><th>Submitted</th><th>Actions</th>
        </tr></thead>
        <tbody>
          ${data.submissions.map(k => `
            <tr>
              <td>${esc(k.user?.name || k.user?.phone)}<br><span style="font-size:11px;color:#64748b">${esc(k.user?.phone || '')}</span></td>
              <td>${esc(k.documentType)}</td>
              <td><span class="badge ${k.status}">${k.status}</span></td>
              <td>${fmtDate(k.createdAt)}</td>
              <td>
                <button class="btn btn-view" onclick="viewKyc('${k.id}')">View</button>
                ${k.status === 'PENDING' ? `
                  <button class="btn btn-approve" onclick="approveKyc('${k.id}')">Approve</button>
                  <button class="btn btn-reject" onclick="rejectKyc('${k.id}')">Reject</button>
                ` : ''}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    window.__kycCache = data.submissions;
  } catch (e) {
    wrap.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

document.getElementById('kyc-status').onchange = loadKyc;

async function approveKyc(id) {
  if (!confirm('Approve this KYC submission?')) return;
  try {
    await api('/kyc/' + id + '/approve', { method: 'POST' });
    alert('KYC approved ✅');
    loadKyc();
    loadStats();
  } catch (e) { alert('Error: ' + e.message); }
}

async function rejectKyc(id) {
  const reason = prompt('Reason for rejection (e.g., "Photo unclear"):');
  if (reason === null) return;
  try {
    await api('/kyc/' + id + '/reject', {
      method: 'POST',
      body: JSON.stringify({ reason }),
    });
    alert('KYC rejected');
    loadKyc();
    loadStats();
  } catch (e) { alert('Error: ' + e.message); }
}

function viewKyc(id) {
  const k = (window.__kycCache || []).find(x => x.id === id);
  if (!k) return;
  const img = (url, label) => {
    if (url && !url.startsWith('https://example.com')) {
      return `<div class="kyc-img-box"><div class="label">${label}</div><img src="${esc(url)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="placeholder" style="display:none">No image</div></div>`;
    }
    return `<div class="kyc-img-box"><div class="label">${label}</div><div class="placeholder">No image uploaded</div></div>`;
  };
  openModal(`
    <div class="modal-header">
      <h2>KYC Submission — ${esc(k.user?.name || k.user?.phone)}</h2>
      <button onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="detail-row"><span class="k">Phone</span><span class="v">${esc(k.user?.phone)}</span></div>
      <div class="detail-row"><span class="k">Document Type</span><span class="v">${esc(k.documentType)}</span></div>
      <div class="detail-row"><span class="k">Status</span><span class="v"><span class="badge ${k.status}">${k.status}</span></span></div>
      <div class="detail-row"><span class="k">Submitted</span><span class="v">${fmtDate(k.createdAt)}</span></div>
      <div class="section-title">Documents</div>
      <div class="kyc-imgs">
        ${img(k.frontImageUrl, 'Front')}
        ${img(k.backImageUrl, 'Back')}
        ${img(k.selfieUrl, 'Selfie')}
      </div>
    </div>
  `);
}

async function loadUsers() {
  const wrap = document.getElementById('users-table');
  wrap.innerHTML = '<div class="loading">Loading users...</div>';
  const q = document.getElementById('user-search').value.trim();
  try {
    const data = await api('/users?q=' + encodeURIComponent(q));
    if (!data.users.length) {
      wrap.innerHTML = '<div class="empty">No users found</div>';
      return;
    }
    wrap.innerHTML = `
      <table>
        <thead><tr>
          <th>Name</th><th>Phone</th><th>KYC</th><th>Credit Score</th>
          <th>Loans</th><th>Guarantors</th><th>Joined</th><th>Actions</th>
        </tr></thead>
        <tbody>
          ${data.users.map(u => `
            <tr>
              <td>${esc(u.name || '—')}</td>
              <td>${esc(u.phone)}</td>
              <td><span class="badge ${u.kycStatus}">${u.kycStatus}</span></td>
              <td>${u.creditScore}</td>
              <td>${u._count.loans}</td>
              <td>${u._count.guarantors}</td>
              <td>${fmtDate(u.createdAt)}</td>
              <td><button class="btn btn-view" onclick="viewUser('${u.id}')">View</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (e) {
    wrap.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

document.getElementById('user-search-btn').onclick = loadUsers;
document.getElementById('user-search').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadUsers();
});

async function viewUser(id) {
  try {
    const data = await api('/users/' + id);
    const u = data.user;
    const loansHtml = u.loans.length === 0
      ? '<div class="empty" style="padding:16px">No loans yet</div>'
      : u.loans.map(l => `
          <div class="detail-row">
            <span class="k">${money(l.amount)} • ${fmtDate(l.appliedAt)}</span>
            <span class="v"><span class="badge ${l.status}">${l.status}</span></span>
          </div>
        `).join('');
    const guarantorsHtml = u.guarantors.length === 0
      ? '<div class="empty" style="padding:16px">No guarantors</div>'
      : u.guarantors.map(g => `
          <div class="detail-row">
            <span class="k">${esc(g.name)} • ${esc(g.relationship)}</span>
            <span class="v"><span class="badge ${g.status === 'VERIFIED' ? 'VERIFIED' : 'PENDING'}">${g.status}</span></span>
          </div>
        `).join('');
    openModal(`
      <div class="modal-header">
        <h2>${esc(u.name || 'User')}</h2>
        <button onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="detail-row"><span class="k">Phone</span><span class="v">${esc(u.phone)}</span></div>
        <div class="detail-row"><span class="k">Email</span><span class="v">${esc(u.email || '—')}</span></div>
        <div class="detail-row"><span class="k">KYC Status</span><span class="v"><span class="badge ${u.kycStatus}">${u.kycStatus}</span></span></div>
        <div class="detail-row"><span class="k">Credit Score</span><span class="v">${u.creditScore}</span></div>
        <div class="detail-row"><span class="k">Joined</span><span class="v">${fmtDate(u.createdAt)}</span></div>
        <div class="section-title">Loans (${u.loans.length})</div>
        ${loansHtml}
        <div class="section-title">Guarantors (${u.guarantors.length})</div>
        ${guarantorsHtml}
      </div>
    `);
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

function openModal(contentHtml) {
  const c = document.getElementById('modal-container');
  c.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">${contentHtml}</div>
  </div>`;
  c.classList.remove('hidden');
}
function closeModal() {
  document.getElementById('modal-container').classList.add('hidden');
  document.getElementById('modal-container').innerHTML = '';
}

document.getElementById('refresh-btn').onclick = () => {
  loadStats();
  loadLoans();
  loadKyc();
  loadUsers();
  if (!document.getElementById('tab-analytics').classList.contains('hidden')) {
    loadAnalytics();
  }
};

if (token) showDashboard();
</script>
</body>
</html>
