<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QuickCash Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh;
  }
  .hidden { display: none !important; }

  /* Login */
  .login-wrap {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .login-card {
    background: #1e293b; border-radius: 16px; padding: 40px;
    width: 100%; max-width: 380px;
    border: 1px solid #334155;
  }
  .login-card h1 {
    font-size: 24px; font-weight: 700; margin-bottom: 8px; color: #fff;
  }
  .login-card p {
    font-size: 14px; color: #94a3b8; margin-bottom: 24px;
  }
  .login-card input {
    width: 100%; padding: 14px 16px; border-radius: 10px;
    border: 1px solid #334155; background: #0f172a;
    color: #fff; font-size: 15px; margin-bottom: 14px;
  }
  .login-card input:focus { outline: none; border-color: #6366f1; }
  .login-card button {
    width: 100%; padding: 14px; border-radius: 10px; border: none;
    background: #6366f1; color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background 0.2s;
  }
  .login-card button:hover { background: #4f46e5; }
  .login-card button:disabled { background: #475569; cursor: not-allowed; }
  .error { color: #f87171; font-size: 13px; margin-top: 10px; }

  /* Header */
  header {
    background: #1e293b; padding: 16px 24px;
    border-bottom: 1px solid #334155;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 18px; font-weight: 700; color: #fff; }
  header .actions { display: flex; gap: 10px; align-items: center; }
  header button {
    padding: 8px 16px; border-radius: 8px; border: 1px solid #334155;
    background: transparent; color: #cbd5e1; cursor: pointer;
    font-size: 13px; font-weight: 500;
  }
  header button:hover { background: #334155; }

  /* Layout */
  main { padding: 24px; max-width: 1400px; margin: 0 auto; }
  .tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .tab {
    padding: 10px 18px; border-radius: 8px; border: 1px solid #334155;
    background: transparent; color: #cbd5e1; cursor: pointer;
    font-size: 14px; font-weight: 500;
  }
  .tab.active { background: #6366f1; color: #fff; border-color: #6366f1; }

  /* Stats grid */
  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px; margin-bottom: 24px;
  }
  .stat-card {
    background: #1e293b; border-radius: 12px; padding: 18px;
    border: 1px solid #334155;
  }
  .stat-card .label {
    font-size: 12px; color: #94a3b8; text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .stat-card .value {
    font-size: 26px; font-weight: 700; color: #fff;
  }
  .stat-card.accent-green .value { color: #4ade80; }
  .stat-card.accent-orange .value { color: #fb923c; }
  .stat-card.accent-blue .value { color: #60a5fa; }
  .stat-card.accent-purple .value { color: #a78bfa; }

  /* Table */
  .table-wrap {
    background: #1e293b; border-radius: 12px;
    border: 1px solid #334155; overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left; padding: 14px 16px; color: #94a3b8;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
    font-weight: 600; border-bottom: 1px solid #334155;
    background: #0f172a;
  }
  td {
    padding: 14px 16px; border-bottom: 1px solid #1e293b;
    color: #cbd5e1;
  }
  tr:hover td { background: #172033; }

  /* Badges */
  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 12px;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
  }
  .badge.PENDING { background: rgba(251,146,60,.15); color: #fb923c; }
  .badge.ACTIVE { background: rgba(74,222,128,.15); color: #4ade80; }
  .badge.PAID { background: rgba(96,165,250,.15); color: #60a5fa; }
  .badge.REJECTED { background: rgba(248,113,113,.15); color: #f87171; }
  .badge.DEFAULTED { background: rgba(248,113,113,.15); color: #f87171; }
  .badge.VERIFIED { background: rgba(74,222,128,.15); color: #4ade80; }

  /* Action buttons */
  .btn {
    padding: 6px 12px; border-radius: 6px; border: none;
    font-size: 12px; font-weight: 600; cursor: pointer;
    margin-right: 6px;
  }
  .btn-approve { background: #16a34a; color: #fff; }
  .btn-approve:hover { background: #15803d; }
  .btn-reject { background: #dc2626; color: #fff; }
  .btn-reject:hover { background: #b91c1c; }

  /* Empty state */
  .empty {
    text-align: center; padding: 40px; color: #64748b;
    font-size: 14px;
  }
  .loading {
    text-align: center; padding: 40px; color: #94a3b8;
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════ -->
<!-- LOGIN SCREEN -->
<!-- ═══════════════════════════════════════ -->
<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <h1>QuickCash Admin</h1>
    <p>Enter your admin password to continue</p>
    <input type="password" id="password-input" placeholder="Admin password" autofocus />
    <button id="login-btn">Sign In</button>
    <div id="login-error" class="error"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════ -->
<!-- DASHBOARD -->
<!-- ═══════════════════════════════════════ -->
<div id="dashboard" class="hidden">
  <header>
    <h1>QuickCash Admin</h1>
    <div class="actions">
      <button id="refresh-btn">↻ Refresh</button>
      <button id="logout-btn">Log Out</button>
    </div>
  </header>

  <main>
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="overview">Overview</button>
      <button class="tab" data-tab="loans">Loans</button>
      <button class="tab" data-tab="users">Users</button>
    </div>

    <!-- Overview Tab -->
    <div id="tab-overview">
      <div class="stats-grid" id="stats-grid">
        <div class="loading">Loading stats...</div>
      </div>
    </div>

    <!-- Loans Tab -->
    <div id="tab-loans" class="hidden">
      <div class="tabs">
        <button class="tab-sub active" data-status="PENDING">Pending</button>
        <button class="tab-sub" data-status="ACTIVE">Active</button>
        <button class="tab-sub" data-status="PAID">Paid</button>
        <button class="tab-sub" data-status="REJECTED">Rejected</button>
        <button class="tab-sub" data-status="ALL">All</button>
      </div>
      <div class="table-wrap" id="loans-table">
        <div class="loading">Loading loans...</div>
      </div>
    </div>

    <!-- Users Tab -->
    <div id="tab-users" class="hidden">
      <div class="table-wrap" id="users-table">
        <div class="loading">Loading users...</div>
      </div>
    </div>
  </main>
</div>

<script>
// ═══════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════
const API = '/api/admin';
let token = localStorage.getItem('admin_token');

// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
}

async function api(path, options = {}) {
  const res = await fetch(API + path, {
    ...options,
    headers: { ...authHeaders(), ...(options.headers || {}) },
  });
  if (res.status === 401 || res.status === 403) {
    logout();
    throw new Error('Session expired');
  }
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || 'Request failed');
  }
  return res.json();
}

function money(n) {
  return '$' + Number(n || 0).toFixed(2);
}

function fmtDate(s) {
  if (!s) return '—';
  return new Date(s).toLocaleString('en-GB', {
    day: '2-digit', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit',
  });
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// ═══════════════════════════════════════
// LOGIN / LOGOUT
// ═══════════════════════════════════════
const loginScreen = document.getElementById('login-screen');
const dashboard = document.getElementById('dashboard');
const loginError = document.getElementById('login-error');

async function login() {
  const pwd = document.getElementById('password-input').value;
  if (!pwd) return;
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  loginError.textContent = '';

  try {
    const res = await fetch(API + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');

    token = data.token;
    localStorage.setItem('admin_token', token);
    showDashboard();
  } catch (e) {
    loginError.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}

function logout() {
  token = null;
  localStorage.removeItem('admin_token');
  dashboard.classList.add('hidden');
  loginScreen.classList.remove('hidden');
  document.getElementById('password-input').value = '';
}

function showDashboard() {
  loginScreen.classList.add('hidden');
  dashboard.classList.remove('hidden');
  loadStats();
  loadLoans('PENDING');
  loadUsers();
}

document.getElementById('login-btn').onclick = login;
document.getElementById('password-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});
document.getElementById('logout-btn').onclick = logout;

// ═══════════════════════════════════════
// TABS
// ═══════════════════════════════════════
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const name = tab.dataset.tab;
    document.getElementById('tab-overview').classList.toggle('hidden', name !== 'overview');
    document.getElementById('tab-loans').classList.toggle('hidden', name !== 'loans');
    document.getElementById('tab-users').classList.toggle('hidden', name !== 'users');
  };
});

document.querySelectorAll('.tab-sub').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab-sub').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    loadLoans(tab.dataset.status);
  };
});

// ═══════════════════════════════════════
// DATA LOADERS
// ═══════════════════════════════════════
async function loadStats() {
  const grid = document.getElementById('stats-grid');
  try {
    const s = await api('/stats');
    grid.innerHTML = `
      <div class="stat-card accent-blue"><div class="label">Total Users</div><div class="value">${s.totalUsers}</div></div>
      <div class="stat-card accent-green"><div class="label">KYC Verified</div><div class="value">${s.kycVerified}</div></div>
      <div class="stat-card accent-orange"><div class="label">Pending Loans</div><div class="value">${s.pendingLoans}</div></div>
      <div class="stat-card accent-green"><div class="label">Active Loans</div><div class="value">${s.activeLoans}</div></div>
      <div class="stat-card accent-blue"><div class="label">Paid Loans</div><div class="value">${s.paidLoans}</div></div>
      <div class="stat-card accent-purple"><div class="label">Total Disbursed</div><div class="value">${money(s.totalDisbursed)}</div></div>
      <div class="stat-card accent-green"><div class="label">Total Collected</div><div class="value">${money(s.totalCollected)}</div></div>
      <div class="stat-card accent-orange"><div class="label">Outstanding</div><div class="value">${money(s.totalExpected - s.totalCollected)}</div></div>
    `;
  } catch (e) {
    grid.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

async function loadLoans(status) {
  const wrap = document.getElementById('loans-table');
  wrap.innerHTML = '<div class="loading">Loading loans...</div>';
  try {
    const data = await api('/loans?status=' + status);
    if (!data.loans.length) {
      wrap.innerHTML = '<div class="empty">No loans in this category</div>';
      return;
    }
    wrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>User</th><th>Amount</th><th>Total Due</th><th>Outstanding</th>
            <th>Duration</th><th>Status</th><th>Applied</th><th>Actions</th>
          </tr>
        </thead>
        <tbody>
          ${data.loans.map(l => `
            <tr>
              <td>${esc(l.user?.name || l.user?.phone || 'Unknown')}<br><span style="font-size:11px;color:#64748b">${esc(l.user?.phone || '')}</span></td>
              <td>${money(l.amount)}</td>
              <td>${money(l.totalDue)}</td>
              <td>${money(l.outstanding)}</td>
              <td>${l.durationDays} days</td>
              <td><span class="badge ${l.status}">${l.status}</span></td>
              <td>${fmtDate(l.appliedAt)}</td>
              <td>
                ${l.status === 'PENDING' ? `
                  <button class="btn btn-approve" onclick="approveLoan('${l.id}')">Approve</button>
                  <button class="btn btn-reject" onclick="rejectLoan('${l.id}')">Reject</button>
                ` : '—'}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (e) {
    wrap.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

async function loadUsers() {
  const wrap = document.getElementById('users-table');
  wrap.innerHTML = '<div class="loading">Loading users...</div>';
  try {
    const data = await api('/users');
    if (!data.users.length) {
      wrap.innerHTML = '<div class="empty">No users yet</div>';
      return;
    }
    wrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Phone</th><th>KYC</th><th>Credit Score</th>
            <th>Loans</th><th>Guarantors</th><th>Joined</th>
          </tr>
        </thead>
        <tbody>
          ${data.users.map(u => `
            <tr>
              <td>${esc(u.name || '—')}</td>
              <td>${esc(u.phone)}</td>
              <td><span class="badge ${u.kycStatus}">${u.kycStatus}</span></td>
              <td>${u.creditScore}</td>
              <td>${u._count.loans}</td>
              <td>${u._count.guarantors}</td>
              <td>${fmtDate(u.createdAt)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (e) {
    wrap.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

// ═══════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════
async function approveLoan(id) {
  if (!confirm('Approve this loan?')) return;
  try {
    await api('/loans/' + id + '/approve', { method: 'POST' });
    alert('Loan approved ✅');
    loadLoans(document.querySelector('.tab-sub.active').dataset.status);
    loadStats();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

async function rejectLoan(id) {
  const reason = prompt('Reason for rejection (optional):');
  if (reason === null) return;
  try {
    await api('/loans/' + id + '/reject', {
      method: 'POST',
      body: JSON.stringify({ reason }),
    });
    alert('Loan rejected');
    loadLoans(document.querySelector('.tab-sub.active').dataset.status);
    loadStats();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

// Refresh button
document.getElementById('refresh-btn').onclick = () => {
  loadStats();
  loadLoans(document.querySelector('.tab-sub.active').dataset.status);
  loadUsers();
};

// ═══════════════════════════════════════
// AUTO-LOGIN if token exists
// ═══════════════════════════════════════
if (token) {
  showDashboard();
}
</script>
</body>
</html>
